details summary{list-style:none;cursor:pointer;min-height:44px}details summary::-webkit-details-marker{display:none}

.chart{width:100%;height:auto;display:block}.chart-label{font-size:10px;fill:var(--mute)}.chart-grid{stroke:var(--line);stroke-dasharray:3 4}.chart-line{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart-point{fill:var(--card);stroke:var(--acc);stroke-width:2.5}.chart-area{fill:var(--acc);opacity:.13}

nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left));background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--line)}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>

var K='fiesta-defteri-v1',tab='ozet',S={},cloud='yerel',DBD=null,pt=null;

{id:'yag',n:'Motor yağı + yağ filtresi',km:15000,ay:12},
{id:'hava',n:'Hava filtresi',km:30000,ay:24},

{id:'polen',n:'Polen filtresi',km:15000,ay:12},
{id:'fren',n:'Fren hidroliği',km:0,ay:24},
{id:'antifriz',n:'Antifriz',km:0,ay:60},
{id:'triger',n:'Triger seti',km:120000,ay:60},

var DR={sehir:'Şehir içi',yol:'Yol',karisik:'Karışık'},AC={0:'Klima kapalı',1:'Klima ara sıra',2:'Klima hep açık'};
function norm(){S=S&&typeof S=='object'&&!Array.isArray(S)?S:{};S.fills=Array.isArray(S.fills)?S.fills:[];S.svc=Array.isArray(S.svc)?S.svc:[];S.odo=Number.isFinite(Number(S.odo))&&Number(S.odo)>0?Number(S.odo):0;S.upd=Number.isFinite(Number(S.upd))?Number(S.upd):0;S.items=Array.isArray(S.items)?S.items:DEF.map(function(x){return Object.assign({last:null},x)});S.items=S.items.filter(function(x){return x&&typeof x=='object'&&x.id!=null&&typeof x.n=='string'});}

norm();
function save(){S.upd=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}clearTimeout(pt);pt=setTimeout(push,700)}
function push(){clearTimeout(pt);pt=null;if(DBD&&currentUser&&syncReady)DBD.set({json:JSON.stringify(S),updatedAt:Date.now()}).then(function(){cloud='bulut';hdr()},function(e){cloud='hata';hdr();console.error('Firestore kayıt hatası:',e)})}
document.addEventListener('visibilitychange',function(){if(document.hidden&&pt)push()});
function hasData(x){return !!(x&&(x.fills&&x.fills.length||x.svc&&x.svc.length||x.odo||x.items&&x.items.some(function(i){return i.last!=null})))}
async function syncUser(user){
 currentUser=user;DBD=fbdb.collection('users').doc(user.uid).collection('state').doc('main');syncReady=false;
 try{
  var snap=await DBD.get();
  if(!snap.exists){await DBD.set({json:JSON.stringify(S),updatedAt:Date.now()})}
  else{
   var remote=JSON.parse(snap.data().json);
   if(!remote||typeof remote!=='object'||!Array.isArray(remote.fills)||!Array.isArray(remote.svc)||!Array.isArray(remote.items))throw new Error('Bulut verisi geçersiz');
   var ru=Number(remote.upd)||0,lu=Number(S.upd)||0;
   if(ru>lu||(!hasData(S)&&hasData(remote))){
    try{localStorage.setItem(K+'-onceki',JSON.stringify(S))}catch(e){}
    S=remote;norm();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
   }else if(lu>ru){await DBD.set({json:JSON.stringify(S),updatedAt:Date.now()})}
  }
  syncReady=true;cloud='bulut';render();
 }catch(e){syncReady=false;cloud='hata';hdr();console.error(e);alert('Bulut eşitlemesi başarısız. Cihazdaki veriler korunuyor. İnternet bağlantısını kontrol et.');}
}
async function initCloud(){try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);auth=firebase.auth();fbdb=firebase.firestore();auth.onAuthStateChanged(function(user){currentUser=user;if(user){if($('cl'))$('cl').textContent='Hesap bağlanıyor…';syncUser(user)}else{DBD=null;syncReady=false;cloud='yerel';render()}})}catch(e){cloud='hata';hdr();console.error(e)}}
async function signIn(){var email=val('authEmail').trim(),pass=val('authPass');$('authErr').textContent='';try{await auth.signInWithEmailAndPassword(email,pass)}catch(e){$('authErr').textContent=authMessage(e)}}
async function signUp(){var email=val('authEmail').trim(),pass=val('authPass');$('authErr').textContent='';if(pass.length<6){$('authErr').textContent='Şifre en az 6 karakter olmalı.';return}try{await auth.createUserWithEmailAndPassword(email,pass)}catch(e){$('authErr').textContent=authMessage(e)}}
async function signOut(){if(auth)await auth.signOut()}
function authMessage(e){return e.code==='auth/email-already-in-use'?'Bu e-posta ile hesap zaten var. Giriş yapmayı dene.':e.code==='auth/invalid-email'?'E-posta adresini kontrol et.':e.code==='auth/weak-password'?'Daha güçlü bir şifre seç.':e.code==='auth/invalid-credential'?'E-posta veya şifre yanlış.':e.message||'İşlem başarısız oldu.'}
function hdr(){var e=$('cl');if(e)e.textContent=cloud=='bulut'?'☁ Bulutta kayıtlı':cloud=='hata'?'Bulut hatası, yerel kayıt var':currentUser?'Bulut bağlanıyor…':'Yalnızca bu cihaz'}
function n(v,d){var digits=Number.isInteger(d)?d:0;return Number(v||0).toLocaleString('tr-TR',{useGrouping:true,maximumFractionDigits:digits,minimumFractionDigits:digits})}
function parseKm(v){var s=String(v==null?'':v).trim().replace(/[.\s]/g,'').replace(/,/g,'');return Number(s)}
function fmtKm(el){var raw=String(el.value||'').replace(/[^0-9]/g,'');if(!raw){el.value='';return}var pos=el.selectionStart||el.value.length;var before=el.value.slice(0,pos).replace(/[^0-9]/g,'').length;var formatted=Number(raw).toLocaleString('tr-TR',{maximumFractionDigits:0,useGrouping:true});el.value=formatted;var p=0,count=0;while(p<formatted.length&&count<before){if(/[0-9]/.test(formatted[p]))count++;p++}try{el.setSelectionRange(p,p)}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;var p=s.split('-').map(Number),d=new Date(Date.UTC(p[0],p[1]-1,p[2]));return d.getUTCFullYear()===p[0]&&d.getUTCMonth()===p[1]-1&&d.getUTCDate()===p[2]}
function fd(s){var p=String(s).split('-');return p.length==3?p[2]+'.'+p[1]+'.'+p[0]:s}
function $(id){return document.getElementById(id)}
function val(id){return $(id).value}
function odo(){var m=S.odo;S.fills.forEach(function(f){if(f.km>m)m=f.km});S.svc.forEach(function(f){if(f.km>m)m=f.km});return m}
function calc(){
 var o=S.fills.slice().sort(function(a,b){return a.km-b.km}).map(function(x){return Object.assign({},x)}),pf=-1,first=-1,last=-1,iv=[],avg=null,tlkm=null;
 o.forEach(function(x,i){if(x.full){
  if(pf>=0){var l=0,c=0;for(var j=pf+1;j<=i;j++){l+=o[j].l;c+=o[j].tl}var d=x.km-o[pf].km;if(d>0){x.cons=l/d*100;x.tlkm=c/d;x.li=l;x.di=d;x.st=(o[pf].station||'').trim();iv.push(x)}}
  if(first<0)first=i;last=i;pf=i}});
 if(first>=0&&last>first){var l=0,c=0;for(var j=first+1;j<=last;j++){l+=o[j].l;c+=o[j].tl}var d=o[last].km-o[first].km;if(d>0){avg=l/d*100;tlkm=c/d}}
 return{rows:o.slice().reverse(),iv:iv,avg:avg,tlkm:tlkm}}
function st(it){
 var o=odo(),L=it.last;if(!L)return{c:'',t:'Henüz kayıt yok',r:3};
 var p=[],bad=0,soon=0;
 if(it.km&&L.km!=null){var r=L.km+it.km-o;p.push(r<0?n(-r)+' km geçti':n(r)+' km kaldı');if(r<0)bad=1;else if(r<1000)soon=1}
 if(it.ay&&L.date){var q=L.date.split('-').map(Number),ml=new Date(q[0],q[1]-1+it.ay+1,0).getDate(),d=new Date(q[0],q[1]-1+it.ay,Math.min(q[2],ml)),t=new Date();t.setHours(0,0,0,0);var g=Math.round((d-t)/864e5);p.push(g<0?(-g)+' gün geçti':g+' gün kaldı');if(g<0)bad=1;else if(g<30)soon=1}
 return{c:bad?'bad':soon?'warn':'ok',t:p.join(' · ')||'—',r:bad?0:soon?1:2}}
function setTab(t){tab=t;render();window.scrollTo(0,0)}
function render(){
 var tabs=[['ozet','Özet'],['yakit','Yakıt'],['analiz','Analiz'],['bakim','Bakım'],['kayit','Kayıt']];
 $('nav').innerHTML=tabs.map(function(t){return '<button class="'+(tab==t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
 $('app').innerHTML={ozet:vOzet,yakit:vYakit,analiz:vAnaliz,bakim:vBakim,kayit:vKayit}[tab]();hdr()}
function trend(c){
 var iv=c.iv;if(iv.length<4)return null;
 var last=iv[iv.length-1].cons,prev=iv.slice(Math.max(0,iv.length-6),iv.length-1),m=prev.reduce(function(a,x){return a+x.cons},0)/prev.length,p=(last/m-1)*100;
 return{last:last,m:m,p:p,bad:p>12}}
function monthly(){
 var m={};function add(d,k,v){var key=String(d).slice(0,7);m[key]=m[key]||{f:0,o:0};m[key][k]+=v}
 S.fills.forEach(function(f){add(f.date,'f',f.tl)});S.svc.forEach(function(r){add(r.date,'o',r.cost||0)});
 var ks=Object.keys(m).sort().slice(-6);
 if(!ks.length)return '<div class="mute">Henüz veri yok.</div>';
 var vals=ks.map(function(k){return m[k].f+m[k].o}),mx=Math.max.apply(null,vals.concat([1]));
 var pts=vals.map(function(v,i){return {x:24+i*(252/Math.max(ks.length-1,1)),y:92-v/mx*62,v:v,k:ks[i]}});
 var poly=pts.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1)}).join(' '),area='24,92 '+poly+' '+pts[pts.length-1].x.toFixed(1)+',92';
 return '<svg class="chart" viewBox="0 0 300 126" role="img" aria-label="Aylık toplam masraf grafiği"><line class="chart-grid" x1="20" y1="30" x2="282" y2="30"/><line class="chart-grid" x1="20" y1="60" x2="282" y2="60"/><line class="chart-grid" x1="20" y1="92" x2="282" y2="92"/><polygon class="chart-area" points="'+area+'"/><polyline class="chart-line" points="'+poly+'"/>'+pts.map(function(p){return '<circle class="chart-point" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5"/><text class="chart-label" x="'+p.x.toFixed(1)+'" y="'+Math.max(12,p.y-8).toFixed(1)+'" text-anchor="middle">₺'+n(p.v)+'</text><text class="chart-label" x="'+p.x.toFixed(1)+'" y="112" text-anchor="middle">'+p.k.slice(5)+'/'+p.k.slice(2,4)+'</text>'}).join('')+'</svg><div class="mute" style="margin-top:6px">Aylık toplam: yakıt + bakım ve diğer masraflar.</div>'}
function vOzet(){
 var o=odo(),c=calc(),fuel=0,sv=0,tr=trend(c);S.fills.forEach(function(f){fuel+=f.tl});S.svc.forEach(function(f){sv+=f.cost||0});
 var odoText=String(Math.round(o)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');var digits=odoText.split('').map(function(d){return d==='.'?'<span class="sep">.</span>':'<span>'+d+'</span>'}).join('');
 var due=S.items.map(function(it){return{it:it,s:st(it)}}).filter(function(x){return x.s.r<2}).sort(function(a,b){return a.s.r-b.s.r}).slice(0,5);
 return '<span class="cloud" id="cl"></span><h1>Ford Fiesta 1.4 TDCi</h1><p class="sub">2012 model dizel</p>'
 +'<div class="card hero-card"><div class="mute">Kilometre</div><div class="odo">'+digits+'</div>'
 +'<div class="row"><input type="number" inputmode="numeric" id="okm" placeholder="Güncel km"><button onclick="setOdo()">Güncelle</button></div></div>'
 +(tr&&tr.bad?'<div class="card alert"><b class="t-warn">Tüketim yükseldi</b><div class="mute">Son aralık '+n(tr.last,1)+' L/100 km; önceki ortalama '+n(tr.m,1)+' (+%'+n(tr.p)+'). Lastik basıncı, hava filtresi veya enjektörleri kontrol ettirmek iyi olabilir.</div></div>':'')
 +'<div class="grid"><div class="card stat"><small>Ort. tüketim</small><b>'+(c.avg?n(c.avg,1)+' L/100 km':'—')+'</b></div>'
 +'<div class="card stat"><small>Km başına maliyet</small><b>'+(c.tlkm?'₺'+n(c.tlkm,2):'—')+'</b></div>'
 +'<div class="card stat"><small>Toplam yakıt</small><b>₺'+n(fuel)+'</b></div>'
 +'<div class="card stat"><small>Bakım ve masraf</small><b>₺'+n(sv)+'</b></div></div>'
 +'<h2>Aylık harcama</h2><div class="card">'+monthly()+'</div>'
 +'<h2>Hatırlatmalar</h2>'
 +(due.length?due.map(function(x){return '<div class="card row"><span><b>'+esc(x.it.n)+'</b><br><span class="mute t-'+x.s.c+'">'+x.s.t+'</span></span><span class="dot '+x.s.c+'"></span></div>'}).join(''):'<div class="card mute">Yaklaşan bakım yok. Bakım sekmesinde her kalemin son yapıldığı tarihi ve km’yi girin.</div>')}
function setOdo(){var v=Number(val('okm'));if(!Number.isFinite(v)||v<=0){alert('Kilometreyi sıfırdan büyük girin.');return}
 var m=0;S.fills.concat(S.svc).forEach(function(r){if(Number(r.km)>m)m=Number(r.km)});
 if(v<m){alert('Kayıtlı bir km değerinden ('+n(m)+') düşük olamaz. Önce hatalı kaydı sil.');return}

  S=o;norm();save();render();$('berr').style.color='var(--ok)';$('berr').textContent='Yedek başarıyla yüklendi.';
 }catch(e){$('berr').style.color='var(--bad)';$('berr').textContent='Yedek geçersiz veya eksik. Mevcut veriler korunmuştur.'}
}
render();initCloud();
</script>
