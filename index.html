<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fiesta Defteri</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14213d;--mute:#5d6b82;--line:#d7dde6;--acc:#14213d;--onacc:#fff;--ok:#2e7d5b;--warn:#b7791f;--bad:#c8372d;--digit:#14213d;--digitink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--ink:#e8edf6;--mute:#93a1ba;--line:#2a3652;--acc:#f2b632;--onacc:#14213d;--ok:#5fc496;--warn:#f2b632;--bad:#ff7a6e;--digit:#0a0f1b;--digitink:#f2b632}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--ink:#e8edf6;--mute:#93a1ba;--line:#2a3652;--acc:#f2b632;--onacc:#14213d;--ok:#5fc496;--warn:#f2b632;--bad:#ff7a6e;--digit:#0a0f1b;--digitink:#f2b632}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:84px;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:22px 0 8px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.odo{display:flex;gap:4px;margin:8px 0 12px}
.odo span{background:var(--digit);color:var(--digitink);font:600 26px/1 ui-monospace,Menlo,monospace;padding:10px 0;width:100%;max-width:44px;text-align:center;border-radius:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:20px}.stat small{color:var(--mute)}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input[type=number],input[type=date],input[type=text],select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:110px;font-size:12px}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:6px}
button{font:inherit;font-weight:600;padding:10px 14px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--onacc);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.del{background:transparent;color:var(--bad);border-color:transparent;padding:4px 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mute)}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
.mute{color:var(--mute);font-size:14px}
.err{color:var(--bad);font-size:14px;min-height:20px}
.bar{height:12px;border-radius:6px;background:var(--acc);min-width:4px}
.track{background:var(--line);border-radius:6px;margin:4px 0}
.mcol{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:8px}
.mcol div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;font-size:11px;color:var(--mute);text-align:center}
.mcol i{display:block;background:var(--acc)}.mcol u{display:block;background:var(--ok);text-decoration:none}
.alert{border-color:var(--warn)}
.cloud{font-size:12px;color:var(--mute);float:right}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:var(--mute);border:0;border-radius:0;padding:14px 2px;font-size:14px}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var K='fiesta-defteri-v1',tab='ozet',S={},cloud='yerel',DBD=null,pt=null;
var DEF=[
{id:'yag',n:'Motor yağı + yağ filtresi',km:15000,ay:12},
{id:'hava',n:'Hava filtresi',km:30000,ay:24},
{id:'mazot',n:'Yakıt (mazot) filtresi',km:30000,ay:24},
{id:'polen',n:'Polen filtresi',km:15000,ay:12},
{id:'fren',n:'Fren hidroliği',km:0,ay:24},
{id:'antifriz',n:'Antifriz',km:0,ay:60},
{id:'triger',n:'Triger seti',km:120000,ay:60},
{id:'lastik',n:'Lastik rotasyonu / balans',km:10000,ay:0},
{id:'muayene',n:'Araç muayenesi',km:0,ay:24},
{id:'trafik',n:'Trafik sigortası',km:0,ay:12},
{id:'kasko',n:'Kasko',km:0,ay:12}];
var CATS=['Yağ ve filtre değişimi','Hava filtresi','Yakıt filtresi','Polen filtresi','Fren hidroliği','Antifriz / soğutma sıvısı','Triger seti','Lastik','Sigorta','Muayene','Otoyol / köprü','Yıkama','Aksesuar','Diğer'];
var DR={sehir:'Şehir içi',yol:'Yol',karisik:'Karışık'},AC={0:'Klima kapalı',1:'Klima ara sıra',2:'Klima hep açık'};
function norm(){S=S&&typeof S=='object'&&!Array.isArray(S)?S:{};S.fills=Array.isArray(S.fills)?S.fills:[];S.svc=Array.isArray(S.svc)?S.svc:[];S.odo=Number.isFinite(Number(S.odo))&&Number(S.odo)>0?Number(S.odo):0;S.upd=Number.isFinite(Number(S.upd))?Number(S.upd):0;S.items=Array.isArray(S.items)?S.items:DEF.map(function(x){return Object.assign({last:null},x)});S.items=S.items.filter(function(x){return x&&typeof x=='object'&&x.id!=null&&typeof x.n=='string'});}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){S={}}
norm();
function save(){S.upd=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}clearTimeout(pt);pt=setTimeout(push,700)}
function push(){if(DBD)DBD.set({json:JSON.stringify(S)}).then(function(){if(cloud!='bulut'){cloud='bulut';hdr()}},function(){cloud='hata';hdr()})}
async function initCloud(){
 try{
  if(!window.claude||!claude.use)return;
  var u=await claude.use('user'),d=await claude.use('db');if(!u||!d)return;
  var id=await u.id();DBD=d.collection('data/users/'+id).doc('state');
  var s=await DBD.get();
  if(s.exists){var r=JSON.parse(s.data().json);if((r.upd||0)>=S.upd){S=r;norm();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}else push()}else push();
  cloud='bulut';render()}catch(e){cloud='hata';hdr()}}
function hdr(){var e=$('cl');if(e)e.textContent=cloud=='bulut'?'☁ Bulutta kayıtlı':cloud=='hata'?'Bulut hatası, yerel kayıt var':'Yalnızca bu cihaz'}
function n(v,d){return Number(v).toLocaleString('tr-TR',{maximumFractionDigits:d||0,minimumFractionDigits:d||0})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function fd(s){var p=String(s).split('-');return p.length==3?p[2]+'.'+p[1]+'.'+p[0]:s}
function $(id){return document.getElementById(id)}
function val(id){return $(id).value}
function odo(){var m=S.odo;S.fills.forEach(function(f){if(f.km>m)m=f.km});S.svc.forEach(function(f){if(f.km>m)m=f.km});return m}
function calc(){
 var o=S.fills.slice().sort(function(a,b){return a.km-b.km}).map(function(x){return Object.assign({},x)}),pf=-1,first=-1,last=-1,iv=[],avg=null,tlkm=null;
 o.forEach(function(x,i){if(x.full){
  if(pf>=0){var l=0,c=0;for(var j=pf+1;j<=i;j++){l+=o[j].l;c+=o[j].tl}var d=x.km-o[pf].km;if(d>0){x.cons=l/d*100;x.tlkm=c/d;x.li=l;x.di=d;x.st=(o[pf].station||'').trim();iv.push(x)}}
  if(first<0)first=i;last=i;pf=i}});
 if(first>=0&&last>first){var l=0,c=0;for(var j=first+1;j<=last;j++){l+=o[j].l;c+=o[j].tl}var d=o[last].km-o[first].km;if(d>0){avg=l/d*100;tlkm=c/d}}
 return{rows:o.slice().reverse(),iv:iv,avg:avg,tlkm:tlkm}}
function st(it){
 var o=odo(),L=it.last;if(!L)return{c:'',t:'Henüz kayıt yok',r:3};
 var p=[],bad=0,soon=0;
 if(it.km&&L.km!=null){var r=L.km+it.km-o;p.push(r<0?n(-r)+' km geçti':n(r)+' km kaldı');if(r<0)bad=1;else if(r<1000)soon=1}
 if(it.ay&&L.date){var d=new Date(L.date);d.setMonth(d.getMonth()+it.ay);var g=Math.round((d-new Date())/864e5);p.push(g<0?(-g)+' gün geçti':g+' gün kaldı');if(g<0)bad=1;else if(g<30)soon=1}
 return{c:bad?'bad':soon?'warn':'ok',t:p.join(' · ')||'—',r:bad?0:soon?1:2}}
function setTab(t){tab=t;render();window.scrollTo(0,0)}
function render(){
 var tabs=[['ozet','Özet'],['yakit','Yakıt'],['analiz','Analiz'],['bakim','Bakım'],['kayit','Kayıt']];
 $('nav').innerHTML=tabs.map(function(t){return '<button class="'+(tab==t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
 $('app').innerHTML={ozet:vOzet,yakit:vYakit,analiz:vAnaliz,bakim:vBakim,kayit:vKayit}[tab]();hdr()}
function trend(c){
 var iv=c.iv;if(iv.length<4)return null;
 var last=iv[iv.length-1].cons,prev=iv.slice(Math.max(0,iv.length-6),iv.length-1),m=prev.reduce(function(a,x){return a+x.cons},0)/prev.length,p=(last/m-1)*100;
 return{last:last,m:m,p:p,bad:p>12}}
function monthly(){
 var m={};function add(d,k,v){var key=String(d).slice(0,7);m[key]=m[key]||{f:0,o:0};m[key][k]+=v}
 S.fills.forEach(function(f){add(f.date,'f',f.tl)});S.svc.forEach(function(r){add(r.date,'o',r.cost||0)});
 var ks=Object.keys(m).sort().slice(-6),mx=Math.max.apply(null,ks.map(function(k){return m[k].f+m[k].o}).concat([1]));
 if(!ks.length)return '<div class="mute">Henüz veri yok.</div>';
 return '<div class="mcol">'+ks.map(function(k){var v=m[k],h=(v.f+v.o)/mx*100;return '<div><span>₺'+n(v.f+v.o)+'</span><u style="height:'+(v.o/mx*90)+'%"></u><i style="height:'+(v.f/mx*90)+'%"></i>'+k.slice(5)+'/'+k.slice(2,4)+'</div>'}).join('')+'</div><div class="mute" style="margin-top:6px">Koyu: yakıt · Yeşil: bakım ve diğer masraflar</div>'}
function vOzet(){
 var o=odo(),c=calc(),fuel=0,sv=0,tr=trend(c);S.fills.forEach(function(f){fuel+=f.tl});S.svc.forEach(function(f){sv+=f.cost||0});
 var digits=String(o).padStart(6,'0').split('').map(function(d){return '<span>'+d+'</span>'}).join('');
 var due=S.items.map(function(it){return{it:it,s:st(it)}}).filter(function(x){return x.s.r<2}).sort(function(a,b){return a.s.r-b.s.r}).slice(0,5);
 return '<span class="cloud" id="cl"></span><h1>Ford Fiesta 1.4 TDCi</h1><p class="sub">2012 model dizel</p>'
 +'<div class="card"><div class="mute">Kilometre</div><div class="odo">'+digits+'</div>'
 +'<div class="row"><input type="number" inputmode="numeric" id="okm" placeholder="Güncel km"><button onclick="setOdo()">Güncelle</button></div></div>'
 +(tr&&tr.bad?'<div class="card alert"><b class="t-warn">Tüketim yükseldi</b><div class="mute">Son aralık '+n(tr.last,1)+' L/100 km; önceki ortalama '+n(tr.m,1)+' (+%'+n(tr.p)+'). Lastik basıncı, hava filtresi veya enjektörleri kontrol ettirmek iyi olabilir.</div></div>':'')
 +'<div class="grid"><div class="card stat"><small>Ort. tüketim</small><b>'+(c.avg?n(c.avg,1)+' L/100 km':'—')+'</b></div>'
 +'<div class="card stat"><small>Km başına yakıt</small><b>'+(c.tlkm?'₺'+n(c.tlkm,2):'—')+'</b></div>'
 +'<div class="card stat"><small>Toplam yakıt</small><b>₺'+n(fuel)+'</b></div>'
 +'<div class="card stat"><small>Bakım ve masraf</small><b>₺'+n(sv)+'</b></div></div>'
 +'<h2>Aylık harcama</h2><div class="card">'+monthly()+'</div>'
 +'<h2>Hatırlatmalar</h2>'
 +(due.length?due.map(function(x){return '<div class="card row"><span><b>'+esc(x.it.n)+'</b><br><span class="mute t-'+x.s.c+'">'+x.s.t+'</span></span><span class="dot '+x.s.c+'"></span></div>'}).join(''):'<div class="card mute">Yaklaşan bakım yok. Bakım sekmesinde her kalemin son yapıldığı tarihi ve km’yi girin.</div>')}
function setOdo(){var v=parseFloat(val('okm'));if(v>0){S.odo=v;save();render()}}
function stations(){var s={};S.fills.forEach(function(f){if(f.station&&f.station.trim())s[f.station.trim()]=1});return Object.keys(s)}
function vYakit(){
 var c=calc();
 return '<span class="cloud" id="cl"></span><h1>Yakıt</h1><p class="sub">Depoyu her doldurduğunda ekle. Sürüş bilgileri, bir önceki dolumdan bu dolum arasındaki yolculuk içindir.</p>'
 +'<div class="card"><label>Tarih</label><input type="date" id="fd" value="'+today()+'">'
 +'<label>İstasyon (yakıtı aldığın yer)</label><input type="text" id="fs" list="stl" placeholder="Örn. Opet Gebze"><datalist id="stl">'+stations().map(function(s){return '<option value="'+esc(s)+'">'}).join('')+'</datalist>'
 +'<label>Kilometre</label><input type="number" inputmode="numeric" id="fk" placeholder="'+odo()+'">'
 +'<div class="grid"><div><label>Litre</label><input type="number" inputmode="decimal" step="any" id="fl"></div><div><label>Toplam ödenen (₺)</label><input type="number" inputmode="decimal" step="any" id="ft"></div></div>'
 +'<div class="grid"><div><label>Sürüş tipi</label><select id="fv"><option value="karisik">Karışık</option><option value="sehir">Şehir içi</option><option value="yol">Yol</option></select></div><div><label>Klima</label><select id="fa"><option value="0">Kapalı</option><option value="1">Ara sıra</option><option value="2">Hep açık</option></select></div></div>'
 +'<label>Sert sürüş oranı: <b id="hv">30</b>%  <span class="mute">(0 = çok yumuşak, 100 = hep sert)</span></label><input type="range" id="fh" min="0" max="100" step="5" value="30" oninput="$(\'hv\').textContent=this.value">'
 +'<label><input type="checkbox" id="ff" checked>Depoyu tamamen doldurdum</label>'
 +'<div class="err" id="ferr"></div><button onclick="addFill()">Kaydet</button></div>'
 +'<h2>Geçmiş</h2>'
 +(c.rows.length?c.rows.map(function(f){return '<div class="card"><div class="row"><b>'+fd(f.date)+' · '+n(f.km)+' km</b><button class="del" onclick="delFill('+f.id+')">Sil</button></div>'
  +'<div class="mute">'+(f.station?esc(f.station)+' · ':'')+n(f.l,1)+' L · ₺'+n(f.tl,2)+' · ₺'+n(f.tl/f.l,2)+'/L<br>'+(DR[f.drive]||'')+' · '+(AC[f.ac]||'')+' · sert sürüş %'+(f.hard==null?'—':f.hard)+(f.cons?'<br>Tüketim: <b>'+n(f.cons,1)+' L/100 km</b> · ₺'+n(f.tlkm,2)+'/km':'')+'</div></div>'}).join(''):'<div class="card mute">Henüz yakıt kaydı yok.</div>')}
function addFill(){
 var k=Number(val('fk')),l=Number(val('fl')),t=Number(val('ft')),d=val('fd');
 if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d)){$('ferr').textContent='Geçerli bir tarih seçin.';return}
 if(!(Number.isFinite(k)&&k>0&&Number.isFinite(l)&&l>0&&Number.isFinite(t)&&t>0)){$('ferr').textContent='Kilometre, litre ve tutarı sıfırdan büyük girin.';return}
 if(l>100||t>10000){$('ferr').textContent='Litre veya tutar olağandışı yüksek görünüyor; bilgileri kontrol edin.';return}
 var maxKm=S.fills.reduce(function(m,f){return Math.max(m,Number(f.km)||0)},0);
 if(k<maxKm){$('ferr').textContent='Bu kilometre, önceki yakıt kayıtlarından düşük. Tarih ve kilometreyi kontrol edin.';return}
 if(S.fills.some(function(f){return Number(f.km)===k})){$('ferr').textContent='Bu kilometrede zaten yakıt kaydı var. Tekrar kayıt oluşturmamak için kontrol edin.';return}
 S.fills.push({id:Date.now(),date:d,km:k,l:l,tl:t,full:$('ff').checked,station:val('fs').trim(),drive:val('fv'),ac:+val('fa'),hard:+val('fh')});
 if(k>S.odo)S.odo=k;save();render()}
function delFill(id){S.fills=S.fills.filter(function(f){return f.id!=id});save();render()}
function vAnaliz(){
 var c=calc(),g={};
 c.iv.forEach(function(x){if(!x.st)return;var a=g[x.st]=g[x.st]||{l:0,d:0,n:0,h:0};a.l+=x.li;a.d+=x.di;a.n++;a.h+=x.hard||0});
 var rows=Object.keys(g).map(function(k){var a=g[k];return{k:k,c:a.l/a.d*100,n:a.n,h:a.h/a.n}}).sort(function(a,b){return a.c-b.c}),mx=Math.max.apply(null,rows.map(function(r){return r.c}).concat([1]));
 var iv=c.iv.slice(-12),tr='';
 if(iv.length>1){var lo=Math.min.apply(null,iv.map(function(x){return x.cons})),hi=Math.max.apply(null,iv.map(function(x){return x.cons})),rg=(hi-lo)||1;
  var pts=iv.map(function(x,i){return (i/(iv.length-1)*300).toFixed(1)+','+(70-(x.cons-lo)/rg*60).toFixed(1)}).join(' ');
  tr='<svg viewBox="0 0 300 80" style="width:100%;height:90px"><polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/></svg><div class="mute">Son '+iv.length+' aralık: en düşük '+n(lo,1)+', en yüksek '+n(hi,1)+' L/100 km</div>'}
 else tr='<div class="mute">Trend için en az 2 tam depo aralığı gerekir.</div>';
 var cat={};S.svc.forEach(function(r){cat[r.name]=(cat[r.name]||0)+(r.cost||0)});
 var cs=Object.keys(cat).filter(function(k){return cat[k]>0}).sort(function(a,b){return cat[b]-cat[a]});
 return '<span class="cloud" id="cl"></span><h1>Analiz</h1><p class="sub">Tüketim, yakıt aldığın istasyona göre gruplanır. Bir doluma ait yakıt, sonraki aralıkta yakıldığı için o aralık, yakıtı aldığın istasyona yazılır.</p>'
 +'<h2>İstasyon performansı</h2><div class="card">'
 +(rows.length?rows.map(function(r,i){return '<div style="margin-bottom:12px"><div class="row"><b>'+(i==0&&rows.length>1&&r.n>=3?'★ ':'')+esc(r.k)+'</b><span>'+n(r.c,1)+' L/100 km</span></div><div class="track"><div class="bar" style="width:'+(r.c/mx*100)+'%"></div></div><div class="mute">'+r.n+' aralık · ort. sert sürüş %'+n(r.h)+(r.n<3?' · <span class="t-warn">yetersiz veri (en az 3 aralık)</span>':'')+'</div></div>'}).join('')+'<div class="mute">Kısa çubuk = daha az yakıt = daha iyi. Sert sürüş oranı farklıysa karşılaştırmayı dikkatli yorumla.</div>':'<div class="mute">İstasyon adıyla en az 2 tam depo kaydı gerekir.</div>')+'</div>'
 +'<h2>Tüketim trendi</h2><div class="card">'+tr+'</div>'
 +'<h2>Koşullara göre tüketim</h2><div class="card">'+cond(c)+'</div>'
 +'<h2>Masraf kategorileri</h2><div class="card">'+(cs.length?cs.map(function(k){return '<div class="row"><span>'+esc(k)+'</span><b>₺'+n(cat[k])+'</b></div>'}).join(''):'<div class="mute">Henüz masraf yok.</div>')+'</div>'}
function cond(c){
 var g={};c.iv.forEach(function(x){[['d',DR[x.drive]],['a',AC[x.ac]]].forEach(function(p){if(!p[1])return;var a=g[p[1]]=g[p[1]]||{l:0,d:0};a.l+=x.li;a.d+=x.di})});
 var ks=Object.keys(g);return ks.length?ks.map(function(k){return '<div class="row"><span>'+k+'</span><b>'+n(g[k].l/g[k].d*100,1)+' L/100 km</b></div>'}).join(''):'<div class="mute">Henüz yeterli veri yok.</div>'}
function vBakim(){
 var rows=S.items.map(function(it){return{it:it,s:st(it)}}).sort(function(a,b){return a.s.r-b.s.r});
 return '<span class="cloud" id="cl"></span><h1>Bakım</h1><p class="sub">Aralıklar tahmini değerlerdir; kullanım kılavuzuna göre düzenle.</p>'
 +rows.map(function(x){var it=x.it,L=it.last,id=it.id;
  return '<details class="card"><summary class="row"><span><b>'+esc(it.n)+'</b><br><span class="mute t-'+x.s.c+'">'+x.s.t+'</span></span><span class="dot '+x.s.c+'"></span></summary>'
  +'<div class="mute" style="margin-top:8px">Aralık: '+(it.km?n(it.km)+' km':'')+(it.km&&it.ay?' / ':'')+(it.ay?it.ay+' ay':'')+(L?'<br>Son yapılan: '+fd(L.date)+(L.km!=null?' · '+n(L.km)+' km':''):'')+'</div>'
  +'<label>Yapıldığı tarih</label><input type="date" id="dd_'+id+'" value="'+today()+'">'
  +'<label>Kilometre</label><input type="number" inputmode="numeric" id="dk_'+id+'" value="'+odo()+'">'
  +'<label>Not</label><input type="text" id="dn_'+id+'">'
  +'<div style="margin-top:10px"><button onclick="done(\''+id+'\')">Yapıldı olarak kaydet</button></div>'
  +'<div class="grid"><div><label>Aralık (km, 0 = yok)</label><input type="number" inputmode="numeric" id="ik_'+id+'" value="'+it.km+'"></div><div><label>Aralık (ay, 0 = yok)</label><input type="number" inputmode="numeric" id="ia_'+id+'" value="'+it.ay+'"></div></div>'
  +'<div class="row" style="margin-top:10px"><button class="ghost" onclick="saveItem(\''+id+'\')">Aralığı kaydet</button><button class="del" onclick="delItem(\''+id+'\')">Kalemi sil</button></div></details>'}).join('')
 +'<h2>Yeni kalem ekle</h2><div class="card"><label>Ad</label><input type="text" id="nn"><div class="grid"><div><label>Km aralığı</label><input type="number" inputmode="numeric" id="nk" value="0"></div><div><label>Ay aralığı</label><input type="number" inputmode="numeric" id="na" value="0"></div></div><div style="margin-top:10px"><button onclick="addItem()">Ekle</button></div></div>'}
function done(id){
 var it=S.items.filter(function(x){return x.id==id})[0],k=Number(val('dk_'+id)),d=val('dd_'+id);
 if(!it)return;
 if(!d||!/\d{4}-\d{2}-\d{2}/.test(d)){alert('Geçerli bir bakım tarihi seçin.');return}
 if(!Number.isFinite(k)||k<0){alert('Kilometreyi kontrol edin.');return}
 if(k>0&&k<Number(it.last&&it.last.km||0)){alert('Girilen kilometre önceki bakım kaydından düşük. Kontrol edin.');return}
 if(!confirm('Bakım geçmişine kaydedilecek. Masrafı ayrıca Kayıt sekmesinden girmeniz gerekir. Devam edilsin mi?'))return;
 it.last={km:k>0?k:null,date:d};
 if(k>S.odo)S.odo=k;save();render()}
function saveItem(id){var it=S.items.filter(function(x){return x.id==id})[0];it.km=parseFloat(val('ik_'+id))||0;it.ay=parseFloat(val('ia_'+id))||0;save();render()}
function delItem(id){S.items=S.items.filter(function(x){return x.id!=id});save();render()}
function addItem(){var t=val('nn').trim();if(!t)return;S.items.push({id:'x'+Date.now(),n:t,km:parseFloat(val('nk'))||0,ay:parseFloat(val('na'))||0,last:null});save();render()}
function vKayit(){
 var s=S.svc.slice().sort(function(a,b){return a.date<b.date?1:-1});
 return '<span class="cloud" id="cl"></span><h1>Kayıtlar</h1><p class="sub">Bakım ve diğer masraflar.</p>'
 +'<div class="card"><b>Masraf ekle</b><label>Kategori</label><select id="ec">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select>'
 +'<div class="grid"><div><label>Tarih</label><input type="date" id="ed" value="'+today()+'"></div><div><label>Tutar (₺)</label><input type="number" inputmode="decimal" step="any" id="et"></div></div>'
 +'<label>Not</label><input type="text" id="en"><div class="err" id="eerr"></div><button onclick="addExp()">Masrafı kaydet</button></div>'
 +'<h2>Geçmiş</h2>'
 +(s.length?s.map(function(r){return '<div class="card"><div class="row"><b>'+esc(r.name)+'</b><button class="del" onclick="delSvc('+r.id+')">Sil</button></div><div class="mute">'+fd(r.date)+(r.km!=null?' · '+n(r.km)+' km':'')+(r.cost?' · ₺'+n(r.cost,2):'')+(r.note?'<br>'+esc(r.note):'')+'</div></div>'}).join(''):'<div class="card mute">Henüz kayıt yok.</div>')
 +'<h2>Yedek</h2><div class="card"><p class="mute" style="margin-top:0">Veriler bulutta da tutulur ('+(cloud=='bulut'?'şu an bağlı':'şu an bağlı değil, yalnızca bu cihazda')+'). İstersen elle yedek de alabilirsin.</p>'
 +'<textarea id="bk" placeholder="Yedek metni burada görünür veya buraya yapıştırın"></textarea>'
 +'<div class="row" style="margin-top:10px"><button onclick="expo()">Yedek oluştur</button><button class="ghost" onclick="impo()">Yedekten yükle</button></div><div class="err" id="berr"></div></div>'}
function addExp(){var t=Number(val('et')),d=val('ed');if(!(Number.isFinite(t)&&t>0)){$('eerr').textContent='Sıfırdan büyük geçerli bir tutar girin.';return}if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d)){$('eerr').textContent='Geçerli bir tarih seçin.';return}S.svc.push({id:Date.now(),name:val('ec'),date:d,km:null,cost:t,note:val('en').trim(),source:'expense'});save();render()}
function delSvc(id){S.svc=S.svc.filter(function(f){return f.id!=id});save();render()}
function expo(){var t=JSON.stringify(S,null,2);$('bk').value=t;var blob=new Blob([t],{type:'application/json;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');var stamp=new Date().toISOString().slice(0,10);a.href=url;a.download='fiesta-defteri-yedek-'+stamp+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);$('berr').textContent='JSON yedeği indirilmeye başlandı. İndirme klasörünü kontrol edin.'}
function impo(){try{var o=JSON.parse(val('bk'));if(!o||typeof o!=='object'||Array.isArray(o)||!Array.isArray(o.fills)||!Array.isArray(o.svc)||!Array.isArray(o.items))throw new Error('shape');if(!o.fills.every(function(f){return f&&typeof f==='object'&&Number.isFinite(Number(f.km))&&Number(f.km)>0&&Number.isFinite(Number(f.l))&&Number(f.l)>0&&Number.isFinite(Number(f.tl))&&Number(f.tl)>0&&typeof f.date==='string'}))throw new Error('fills');if(!o.svc.every(function(r){return r&&typeof r==='object'&&typeof r.name==='string'&&typeof r.date==='string'&&Number.isFinite(Number(r.cost||0))&&Number(r.cost||0)>=0}))throw new Error('svc');if(!o.items.every(function(it){return it&&typeof it==='object'&&it.id!=null&&typeof it.n==='string'}))throw new Error('items');if(!confirm('Yedek yüklendiğinde mevcut bu cihazdaki verilerin üzerine yazılır. Önce mevcut verilerin yedeğini aldıysan devam et. Yedeği yükleyelim mi?'))return;S=o;norm();save();render()}catch(e){$('berr').textContent='Yedek geçersiz veya eksik. Mevcut veriler korunmuştur.'}}
render();initCloud();
</script>
</body>
</html>
