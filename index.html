function vYakit(){
 var c=calc(),g={};
 c.iv.forEach(function(x){if(!x.st)return;var key=stationKey(x.st);if(!key)return;var a=g[key]=g[key]||{name:String(x.st).trim().replace(/\s+/g,' '),l:0,d:0,n:0,h:0};a.l+=x.li;a.d+=x.di;a.n++;a.h+=(Number(x.hard)||0)*x.di});
 var rows=Object.keys(g).map(function(k){var a=g[k];return{k:a.name,c:a.l/a.d*100,n:a.n,h:a.h/a.d}}).sort(function(a,b){return a.c-b.c}),mx=Math.max.apply(null,rows.map(function(r){return r.c}).concat([1]));
 var good=rows.filter(function(r){return r.n>=2}),best=good.length>1?good[0]:null;
 var iv=c.iv.slice(-8),tr='';
 if(iv.length>=1){
  var last=iv[iv.length-1],prev=iv.length>1?iv[iv.length-2]:null,diff=prev?last.cons-prev.cons:null;
  tr='<div class="row" style="margin-bottom:6px"><div><div class="cap">Son tüketim</div><div class="big-n">'+n(last.cons,1)+'</div></div><div style="text-align:right"><div class="cap">Önceki aralığa göre</div><div class="big-n '+(diff===null?'':diff>0?'t-warn':diff<0?'t-ok':'')+'">'+(diff===null?'—':(diff>0?'+':'')+n(diff,1))+'</div></div></div>'

  +'<div class="mute">Son '+iv.length+' aralık. Grafiğe dokunup kaydırarak her ölçümü görebilirsin. Çizgi aşağı iniyorsa tüketim azalıyor.</div>';
 } else tr='<div class="mute">Henüz ölçülebilir aralık yok. İki tam dolum kaydı ve aralarında pozitif kilometre farkı gerekir.</div>';
 var fl=c.rows.slice().reverse().slice(-8),pr='';
 if(fl.length>=2)pr=lineChart('cp',fl.map(function(f){var v=f.tl/f.l;return{v:v,lab:fd(f.date).slice(0,5),t1:'₺'+n(v,2)+' / L',t2:fd(f.date)+(f.station?' · '+f.station:'')}}),{aria:'Litre fiyatı grafiği',fy:function(v){return '₺'+n(v,1)}});
 var cat={};S.svc.forEach(function(r){cat[r.name]=(cat[r.name]||0)+(Number(r.cost)||0)});
 var cs=Object.keys(cat).filter(function(k){return cat[k]>0}).sort(function(a,b){return cat[b]-cat[a]}),tot=cs.reduce(function(a,k){return a+cat[k]},0);
 var tp=cs.slice(0,5).map(function(k){return{k:k,v:cat[k]}}),rs=cs.slice(5).reduce(function(a,k){return a+cat[k]},0);if(rs>0)tp.push({k:'Diğer',v:rs});
 var stationRows=rows.length?rows.map(function(r){return hbar(esc(r.k),n(r.c,1)+' L/100',r.c/mx*100,r.n+' aralık · ort. sert sürüş %'+n(r.h)+(r.n<2?' · <span class="t-warn">ön sonuç; en az 2 aralık gerekir</span>':''),r===best)}).join(''):'<div class="mute">Henüz istasyon bazlı aralık yok. Her tam dolumda istasyon adını yaz; 2 tam dolum 1 aralık oluşturur.</div>';
 return '<span class="cloud" id="cl"></span><h1>Yakıt</h1><p class="sub">Tüketim yalnızca ardışık tam dolumlar arasından hesaplanır.</p>'
 +'<div class="card">'+tr+'</div>'
 +(pr?'<h2>Litre fiyatı</h2><div class="card">'+pr+'</div>':'')
 +'<h2>İstasyon performansı</h2><div class="card">'+stationRows+'</div>'
 +'<h2>Koşullara göre tüketim</h2><div class="card">'+cond(c)+'</div>'
 +(tot>0?'<h2>Masraf dağılımı</h2><div class="card">'+donut('cd',tp,tot)+'</div>':'')
 +'<h2>Geçmiş</h2>'
 +(c.rows.length?c.rows.map(function(f){return '<div class="card"><div class="row"><b>'+fd(f.date)+' · '+n(f.km)+' km</b><button class="del" onclick="delFill('+f.id+')">Sil</button></div>'
  +'<div class="mute">'+(f.station?esc(f.station)+' · ':'')+n(f.l,1)+' L · ₺'+n(f.tl,2)+' · ₺'+n(f.tl/f.l,2)+'/L<br>'+(DR[f.drive]||'')+' · '+(AC[f.ac]||'')+' · sert sürüş %'+(f.hard==null?'—':f.hard)+(f.cons?'<br>Tüketim: <b>'+n(f.cons,1)+' L/100 km</b> · ₺'+n(f.tlkm,2)+'/km':'')+'</div></div>'}).join(''):'<div class="card mute">Henüz yakıt kaydı yok. Sağ alttaki + düğmesiyle ekleyebilirsin.</div>')}
function cond(c){
 var g={};c.iv.forEach(function(x){[['d',DR[x.drive]],['a',AC[x.ac]]].forEach(function(p){if(!p[1])return;var a=g[p[1]]=g[p[1]]||{l:0,d:0};a.l+=x.li;a.d+=x.di})});
 var ks=Object.keys(g);if(!ks.length)return '<div class="mute">Henüz yeterli veri yok.</div>';
 var cv=ks.map(function(k){return g[k].l/g[k].d*100}),mx=Math.max.apply(null,cv.concat([1]));
 return ks.map(function(k,i){return hbar(k,n(cv[i],1)+' L/100',cv[i]/mx*100,'',false)}).join('')}
function addFill(){
 var k=parseKm(val('fk')),l=Number(val('fl')),t=Number(val('ft')),d=val('fd');
 if(!validDate(d)){$('ferr').textContent='Geçerli bir tarih seçin (Ayrıntılar).';return}
 if(d>today()){$('ferr').textContent='Gelecek tarihli kayıt girilemez.';return}
 if(!(Number.isFinite(k)&&k>0&&Number.isFinite(l)&&l>0&&Number.isFinite(t)&&t>0)){$('ferr').textContent='Kilometre, litre ve tutarı sıfırdan büyük girin.';return}
 if(l>100||t>10000){$('ferr').textContent='Litre veya tutar olağandışı yüksek görünüyor; bilgileri kontrol edin.';return}
 if(S.fills.some(function(f){return Number(f.km)===k})){$('ferr').textContent='Bu kilometrede zaten yakıt kaydı var. Kontrol edin.';return}
 var maxKm=S.fills.reduce(function(m,f){return Math.max(m,Number(f.km)||0)},0);
 if(k<maxKm&&!confirm('Bu kilometre, kayıtlı en yüksek kilometreden ('+n(maxKm)+') düşük. Unuttuğun eski bir dolumu mu ekliyorsun?'))return;
 S.fills.push({id:Date.now(),date:d,km:k,l:l,tl:t,full:$('ff').checked,station:val('fs').trim(),drive:val('fv'),ac:+val('fa'),hard:+val('fh')});
 if(k>S.odo)S.odo=k;save();closeSheet();render();toast('Yakıt kaydedildi')}

function vBakim(){
 var rows=S.items.map(function(it){return{it:it,s:st(it)}}).sort(function(a,b){return a.s.r-b.s.r}),sv=S.svc.slice().sort(function(a,b){return a.date<b.date?1:-1});

  return '<details class="card"><summary class="row"><span style="display:flex;align-items:center;gap:14px">'+ring(48,7,x.s.p,colOf(x.s.c))+'<span><b>'+esc(it.n)+'</b><br><span class="mute t-'+x.s.c+'">'+x.s.t+'</span></span></span></summary>'
  +'<div class="mute" style="margin-top:8px">Aralık: '+(it.km?n(it.km)+' km':'')+(it.km&&it.ay?' / ':'')+(it.ay?it.ay+' ay':'')+(L?'<br>Son yapılan: '+fd(L.date)+(L.km!=null?' · '+n(L.km)+' km':''):'')+'</div>'
  +'<label>Yapıldığı tarih</label><input type="date" id="dd_'+id+'" value="'+today()+'">'
  +'<label>Kilometre</label><input type="number" inputmode="numeric" id="dk_'+id+'" value="'+odo()+'">'
  +'<label>Tutar (₺, isteğe bağlı)</label><input type="number" inputmode="decimal" step="any" id="dc_'+id+'" placeholder="Girersen masraflara da eklenir">'
  +'<label>Not</label><input type="text" id="dn_'+id+'">'

 +'<h2>Yeni kalem ekle</h2><div class="card"><label style="margin-top:0">Ad</label><input type="text" id="nn"><div class="grid"><div><label>Km aralığı</label><input type="number" inputmode="numeric" id="nk" value="0"></div><div><label>Ay aralığı</label><input type="number" inputmode="numeric" id="na" value="0"></div></div><div style="margin-top:12px"><button onclick="addItem()">Ekle</button></div></div>'

function done(id){
 var it=S.items.filter(function(x){return x.id==id})[0];if(!it)return;
 var k=Number(val('dk_'+id)),d=val('dd_'+id),c=Number(val('dc_'+id))||0,note=val('dn_'+id).trim();
 if(!validDate(d)){alert('Geçerli bir bakım tarihi seçin.');return}
 if(d>today()){alert('Gelecek tarih girilemez.');return}
 if(!Number.isFinite(k)||k<0){alert('Kilometreyi kontrol edin.');return}
 if(c<0){alert('Tutar negatif olamaz.');return}
 if(k>0&&it.last&&it.last.km!=null&&k<Number(it.last.km)){alert('Girilen kilometre önceki bakım kaydından düşük. Kontrol edin.');return}
 it.last={km:k>0?k:null,date:d};
 if(c>0)S.svc.push({id:Date.now(),name:it.n,date:d,km:k>0?k:null,cost:c,note:note,source:'maintenance'});
 if(k>S.odo)S.odo=k;save();render();toast('Bakım kaydedildi')}

 return '<span class="cloud" id="cl"></span><h1>Ayarlar</h1>'
 +'<div class="card"><b>☁ Bulut eşitleme</b><p class="mute">E-posta ve şifreyle giriş yaparak kayıtlarını telefon ve diğer cihazlar arasında eşitleyebilirsin. Hangi cihazdaki veri daha yeniyse o kullanılır.</p>'

 +'<h2>Yedek</h2><div class="card"><p class="mute" style="margin-top:0">Veriler bulutta da tutulur ('+(cloud=='bulut'?'şu an bağlı':'şu an bağlı değil, yalnızca bu cihazda')+'). İstersen elle yedek de alabilirsin.</p>'

function expo(){
 var t=JSON.stringify(S,null,2);$('bk').value=t;$('bk').select();var msg='Yedek metni kutuya yazıldı.';
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);msg='Yedek kutuya yazıldı ve panoya kopyalandı. Notlar uygulamasına yapıştırıp saklayabilirsin.'}}catch(e){}

 $('berr').style.color='var(--ok)';$('berr').textContent=msg}
function impo(){
 try{
  var o=JSON.parse(val('bk'));
  if(!o||typeof o!=='object'||Array.isArray(o)||!Array.isArray(o.fills)||!Array.isArray(o.svc)||!Array.isArray(o.items))throw new Error('shape');
  if(o.fills.length>5000||o.svc.length>5000||o.items.length>500)throw new Error('limit');
  if(!o.fills.every(function(f){return f&&typeof f==='object'&&Number.isSafeInteger(Number(f.id))&&Number(f.id)>0&&Number.isFinite(Number(f.km))&&Number(f.km)>0&&Number(f.km)<=10000000&&Number.isFinite(Number(f.l))&&Number(f.l)>0&&Number(f.l)<=100&&Number.isFinite(Number(f.tl))&&Number(f.tl)>0&&Number(f.tl)<=100000&&validDate(f.date)&&typeof f.full==='boolean'&&['sehir','yol','karisik'].indexOf(f.drive)>=0&&[0,1,2].indexOf(Number(f.ac))>=0&&Number.isFinite(Number(f.hard))&&Number(f.hard)>=0&&Number(f.hard)<=100&&(f.station==null||typeof f.station==='string'&&f.station.length<=200)}))throw new Error('fills');
  if(!o.svc.every(function(r){return r&&typeof r==='object'&&Number.isSafeInteger(Number(r.id))&&Number(r.id)>0&&typeof r.name==='string'&&r.name.length<=200&&validDate(r.date)&&(r.km==null||Number.isFinite(Number(r.km))&&Number(r.km)>=0&&Number(r.km)<=10000000)&&Number.isFinite(Number(r.cost||0))&&Number(r.cost||0)>=0&&Number(r.cost||0)<=100000000&&(r.note==null||typeof r.note==='string'&&r.note.length<=500)}))throw new Error('svc');
  var seen={};
  if(!o.items.every(function(it){if(!it||typeof it!=='object'||typeof it.id!=='string'&&typeof it.id!=='number'||!/^[a-zA-Z0-9_-]{1,40}$/.test(String(it.id))||typeof it.n!=='string'||!it.n.trim()||it.n.length>120||!Number.isFinite(Number(it.km))||Number(it.km)<0||Number(it.km)>10000000||!Number.isFinite(Number(it.ay))||Number(it.ay)<0||Number(it.ay)>1200)return false;var key=String(it.id);if(seen[key])return false;seen[key]=true;if(it.last!=null&&(!it.last||typeof it.last!=='object'||!validDate(it.last.date)||(it.last.km!=null&&(!Number.isFinite(Number(it.last.km))||Number(it.last.km)<0||Number(it.last.km)>10000000))))return false;return true}))throw new Error('items');
  if(o.odo!=null&&(!Number.isFinite(Number(o.odo))||Number(o.odo)<0||Number(o.odo)>10000000))throw new Error('odo');
  if(!confirm('Yedek yüklenince bu cihazdaki veriler yedekteki verilerle değiştirilir. Devam edilsin mi?'))return;
  S=o;norm();save();render();toast('Yedek yüklendi');
 }catch(e){$('berr').style.color='var(--bad)';$('berr').textContent='Yedek geçersiz veya eksik. Mevcut veriler korunmuştur.'}
}
